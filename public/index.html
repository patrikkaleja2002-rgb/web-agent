<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Agent – Odeslání webu klientovi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a1628;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(30, 80, 200, 0.45) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 110%, rgba(180, 20, 30, 0.2) 0%, transparent 60%);
    }

    .card {
      background: rgba(15, 25, 55, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      box-shadow:
        0 8px 48px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.04) inset;
      padding: 44px 40px;
      width: 100%;
      max-width: 500px;
    }

    /* ── Nadpis v barvách české vlajky ── */
    .logo {
      display: flex;
      align-items: baseline;
      gap: 0;
      margin-bottom: 8px;
    }

    .logo-text {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(100deg,
        #1a6fd4 0%,
        #4fa3ff 18%,
        #ffffff 38%,
        #ffffff 52%,
        #ff4d5e 70%,
        #c0001a 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter:
        drop-shadow(0 0 12px rgba(80, 160, 255, 0.7))
        drop-shadow(0 0 28px rgba(255, 77, 94, 0.45))
        drop-shadow(0 0 6px rgba(255,255,255,0.3));
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        filter:
          drop-shadow(0 0 10px rgba(80, 160, 255, 0.65))
          drop-shadow(0 0 24px rgba(255, 77, 94, 0.4))
          drop-shadow(0 0 5px rgba(255,255,255,0.25));
      }
      50% {
        filter:
          drop-shadow(0 0 18px rgba(80, 160, 255, 0.9))
          drop-shadow(0 0 40px rgba(255, 77, 94, 0.6))
          drop-shadow(0 0 12px rgba(255,255,255,0.5));
      }
    }

    .subtitle {
      font-size: 0.88rem;
      color: rgba(180, 200, 240, 0.65);
      margin-bottom: 32px;
      letter-spacing: 0.01em;
    }

    /* ── Oddělovač sekce ── */
    .section-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 6px 0 22px;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(150,180,240,0.5);
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.83rem;
      font-weight: 700;
      color: rgba(200, 225, 255, 0.95);
      margin-bottom: 7px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .required::after {
      content: " *";
      color: #ff4d5e;
    }

    input, textarea {
      width: 100%;
      padding: 13px 18px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(120, 170, 255, 0.25);
      border-radius: 10px;
      font-size: 0.97rem;
      font-family: inherit;
      color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    input::placeholder, textarea::placeholder {
      color: rgba(150, 185, 240, 0.45);
    }

    input:hover, textarea:hover {
      border-color: rgba(120, 170, 255, 0.5);
      background: rgba(255,255,255,0.1);
    }

    input:focus, textarea:focus {
      border-color: rgba(100, 160, 255, 0.85);
      background: rgba(20, 50, 130, 0.25);
      box-shadow: 0 0 0 3px rgba(80, 130, 255, 0.2), 0 0 24px rgba(80, 130, 255, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a56e8 0%, #e63946 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.97rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.02em;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(26, 86, 232, 0.4), 0 0 40px rgba(230, 57, 70, 0.15);
    }

    button::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(26, 86, 232, 0.55), 0 0 60px rgba(230, 57, 70, 0.25);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
    }

    #status.success {
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(110, 231, 183, 0.25);
    }

    #status.error {
      background: rgba(230, 57, 70, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(252, 165, 165, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-text">Web Agent</span>
    </div>
    <p class="subtitle">Odešle klientovi e-mail s odkazem na hotový web.</p>

    <form id="sendForm">

      <!-- Typ emailu -->
      <label class="required">Typ e-mailu</label>
      <div style="display:flex;gap:10px;margin-bottom:18px">
        <label id="tab-done" onclick="setType('done')" style="flex:1;cursor:pointer;padding:12px;border-radius:10px;border:1.5px solid rgba(26,86,232,0.8);background:rgba(26,86,232,0.18);text-align:center;transition:all 0.2s">
          <div style="font-size:20px;margin-bottom:4px">🚀</div>
          <div style="color:#fff;font-size:0.82rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Hotový projekt</div>
        </label>
        <label id="tab-demo" onclick="setType('demo')" style="flex:1;cursor:pointer;padding:12px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);text-align:center;transition:all 0.2s">
          <div style="font-size:20px;margin-bottom:4px">👀</div>
          <div style="color:rgba(200,225,255,0.7);font-size:0.82rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Úvodní stránka</div>
        </label>
      </div>
      <input type="hidden" id="emailType" value="done" />

      <!-- Odesílatel -->
      <label class="required" for="senderName">Tvoje jméno</label>
      <input type="text" id="senderName" placeholder="Patrik" required />

      <label class="required" for="senderEmail">Tvůj Gmail</label>
      <input type="email" id="senderEmail" placeholder="tvuj.email@gmail.com" required />

      <label class="required" for="appPassword">Gmail App Password</label>
      <input type="password" id="appPassword" placeholder="xxxx xxxx xxxx xxxx" required />
      <div style="margin-top:-12px;margin-bottom:18px;font-size:0.78rem;color:rgba(150,185,240,0.6);line-height:1.5">
        Není to tvoje normální heslo.
        <a href="https://myaccount.google.com/apppasswords" target="_blank" style="color:rgba(100,160,255,0.85);text-decoration:underline">Vygeneruj App Password zde</a>
        — potřebuješ mít zapnuté dvoufázové ověření.
      </div>

      <!-- Klient -->
      <label class="required" for="clientName">Jméno klienta</label>
      <input type="text" id="clientName" placeholder="Jan Novák" required />

      <label class="required" for="clientEmail">E-mail klienta</label>
      <input type="email" id="clientEmail" placeholder="klient@example.com" required />

      <!-- Projekt -->
      <label class="required" for="projectName">Název projektu / webu</label>
      <input type="text" id="projectName" placeholder="Kavárna U Nováků" required />

      <label class="required" for="websiteUrl">URL webu</label>
      <input type="url" id="websiteUrl" placeholder="https://novakuv-web.cz" required />

      <label for="note">Poznámka pro klienta (nepovinné)</label>
      <input type="text" id="note" placeholder="Např. přihlašovací údaje do WordPressu…" />

      <button type="submit" id="sendBtn">Odeslat e-mail</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("sendForm");
    const btn  = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    function setType(t) {
      document.getElementById("emailType").value = t;
      const done = document.getElementById("tab-done");
      const demo = document.getElementById("tab-demo");
      if (t === "done") {
        done.style.border = "1.5px solid rgba(26,86,232,0.8)";
        done.style.background = "rgba(26,86,232,0.18)";
        done.querySelector("div:last-child").style.color = "#fff";
        demo.style.border = "1.5px solid rgba(255,255,255,0.1)";
        demo.style.background = "rgba(255,255,255,0.04)";
        demo.querySelector("div:last-child").style.color = "rgba(200,225,255,0.7)";
      } else {
        demo.style.border = "1.5px solid rgba(124,58,237,0.8)";
        demo.style.background = "rgba(124,58,237,0.18)";
        demo.querySelector("div:last-child").style.color = "#fff";
        done.style.border = "1.5px solid rgba(255,255,255,0.1)";
        done.style.background = "rgba(255,255,255,0.04)";
        done.querySelector("div:last-child").style.color = "rgba(200,225,255,0.7)";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Odesílám…";
      statusEl.style.display = "none";

      const payload = {
        type:        document.getElementById("emailType").value,
        senderName:  document.getElementById("senderName").value.trim(),
        senderEmail: document.getElementById("senderEmail").value.trim(),
        appPassword: document.getElementById("appPassword").value.trim(),
        clientName:  document.getElementById("clientName").value.trim(),
        clientEmail: document.getElementById("clientEmail").value.trim(),
        projectName: document.getElementById("projectName").value.trim(),
        websiteUrl:  document.getElementById("websiteUrl").value.trim(),
        note:        document.getElementById("note").value.trim(),

      };

      try {
        const res  = await fetch("/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
          statusEl.className = "success";
          statusEl.textContent = data.message;
          form.reset();
        } else {
          statusEl.className = "error";
          statusEl.textContent = data.error;
        }
      } catch {
        statusEl.className = "error";
        statusEl.textContent = "Nepodařilo se spojit se serverem.";
      } finally {
        statusEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Odeslat e-mail";
      }
    });
  </script>
</body>
</html>
